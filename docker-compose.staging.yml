# Independent project; never combine with production Compose or its .env.
name: consulteam-staging
services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    container_name: consulteam-staging-postgres
    environment:
      POSTGRES_USER: staging
      POSTGRES_DB: consulteam_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Run scripts/staging.py init}
    ports: !override ["127.0.0.1:25432:5432"]
    volumes: !override ["staging_db:/var/lib/postgresql/data"]
    networks: [isolated, edge]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staging -d consulteam_staging"]
  backend:
    build: ./backend
    env_file: .staging/backend.env
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["staging_documents:/app/private_documents"]
    networks: [isolated]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  bridge:
    build: ./whatsapp-bridge
    env_file: .staging/bridge.env
    volumes: ["staging_sessions:/app/auth_info_baileys"]
    networks: [isolated]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/sessions',{headers:{Authorization:'Bearer '+process.env.BRIDGE_API_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  frontend:
    build: ./frontend
    networks: [isolated]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  gateway:
    image: caddy:2-alpine
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.staging/tls:/etc/staging-tls:ro
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    networks: [isolated, edge]
networks:
  edge:
  isolated:
    internal: true
volumes:
  staging_db:
  staging_documents:
  staging_sessions:
