services:
  postgres:
    image: postgres:16-alpine
    container_name: insta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insta_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insta_password}
      POSTGRES_DB: ${POSTGRES_DB:-insta_crm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insta_user} -d ${POSTGRES_DB:-insta_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
